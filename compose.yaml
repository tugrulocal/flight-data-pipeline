name: flight-data-pipeline

services:
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  topic-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: aircraft.positions.raw.v1
      KAFKA_DLQ_TOPIC: aircraft.positions.dlq.v1
      KAFKA_RAW_RETENTION_MS: ${KAFKA_RAW_RETENTION_MS:-172800000}
      KAFKA_RAW_RETENTION_BYTES: ${KAFKA_RAW_RETENTION_BYTES:-10737418240}
      KAFKA_DLQ_RETENTION_MS: ${KAFKA_DLQ_RETENTION_MS:-2592000000}
      KAFKA_DLQ_RETENTION_BYTES: ${KAFKA_DLQ_RETENTION_BYTES:-1073741824}
    volumes:
      - ./kafka/init-topics.sh:/opt/flight/init-topics.sh:ro
    entrypoint: ["/bin/sh", "/opt/flight/init-topics.sh"]
    restart: "no"

  mongodb:
    image: mongo:8.0.28@sha256:98605bfa1bb2a15dd82109e1d78ad31527a9a744909fab4606076fa71a0ae515
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  producer:
    image: ghcr.io/tugrulocal/flight-data-pipeline-producer:${APP_VERSION:-1.0.0-rc.1}
    restart: ${PRODUCER_RESTART_POLICY:-unless-stopped}
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: aircraft.positions.raw.v1
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      MAX_POLLS: ${MAX_POLLS:-0}
      OPENSKY_AREA_MODE: ${OPENSKY_AREA_MODE:-turkey}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}

  consumer:
    image: ghcr.io/tugrulocal/flight-data-pipeline-consumer:${APP_VERSION:-1.0.0-rc.1}
    restart: unless-stopped
    depends_on:
      topic-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: aircraft.positions.raw.v1
      KAFKA_DLQ_TOPIC: aircraft.positions.dlq.v1
      KAFKA_CONSUMER_GROUP: flight-mongodb-writer-v1
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: flightdb
      RAW_POSITIONS_RETENTION_HOURS: ${RAW_POSITIONS_RETENTION_HOURS:-48}
      LIVE_POSITIONS_RETENTION_HOURS: ${LIVE_POSITIONS_RETENTION_HOURS:-168}
      CONSUMER_MAX_ATTEMPTS: ${CONSUMER_MAX_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_SECONDS: ${CONSUMER_RETRY_BACKOFF_SECONDS:-1}

  backend:
    image: ghcr.io/tugrulocal/flight-data-pipeline-backend:${APP_VERSION:-1.0.0-rc.1}
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      topic-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.1}
      APP_PORT: ${APP_PORT:-5173}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: aircraft.positions.raw.v1
      KAFKA_REALTIME_CONSUMER_GROUP: flight-realtime-gateway-v1
      WEBSOCKET_BATCH_INTERVAL_MS: ${WEBSOCKET_BATCH_INTERVAL_MS:-250}
      WEBSOCKET_BATCH_MAX_SIZE: ${WEBSOCKET_BATCH_MAX_SIZE:-500}
      LIVE_POSITION_WINDOW_MINUTES: ${LIVE_POSITION_WINDOW_MINUTES:-10}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: flightdb
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    image: ghcr.io/tugrulocal/flight-data-pipeline-frontend:${APP_VERSION:-1.0.0-rc.1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  kafka-data:
    name: flight-kafka-data
  mongodb-data:
    name: flight-mongodb-data
