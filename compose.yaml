name: flight-data-pipeline

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  topic-init:
    image: apache/kafka:4.3.1

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh

    command:
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - aircraft.positions.raw.v1
      - --partitions
      - "1"
      - --replication-factor
      - "1"

    restart: "no"

  mongodb:
    image: mongo:8.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb-data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 }).ok"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    restart: unless-stopped

    depends_on:
      topic-init:
        condition: service_completed_successfully

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: aircraft.positions.raw.v1
      POLL_INTERVAL_SECONDS: "300"
      MAX_POLLS: "0"

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    restart: unless-stopped

    depends_on:
      topic-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: aircraft.positions.raw.v1
      KAFKA_CONSUMER_GROUP: flight-mongodb-writer-v1
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: flightdb

volumes:
  kafka-data:
    name: flight-kafka-data

  mongodb-data:
    name: flight-mongodb-data
