name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_gate:
        description: Resmî Kafka ve MongoDB image'larını da release kapısında tara
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Bağımlılıkları doğrula ve kur
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --require-hashes -r producer/requirements.txt
          python -m pip install --require-hashes -r consumer/requirements.txt
          python -m pip install --require-hashes -r backend/requirements.txt
      - name: Python testleri
        run: pytest -q
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-build.txt
          pip-audit -r producer/requirements.txt
          pip-audit -r consumer/requirements.txt
          pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose sözleşmesi
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet

  multiarch-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Platform image'larını oluştur
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          for service in producer consumer backend frontend; do
            docker buildx build \
              --platform "linux/$PLATFORM" \
              --file "$service/Dockerfile" \
              --tag "flight-data-pipeline-$service:ci-$PLATFORM" \
              --load \
              .
          done
      - name: Production image içeriğini doğrula
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "linux/$PLATFORM" --entrypoint sh flight-data-pipeline-producer:ci-$PLATFORM -c 'test ! -e /app/mock_producer.py && test ! -d /app/tests && ! command -v gcc && python -c "import confluent_kafka; assert confluent_kafka.version() == \"2.12.1\"; assert confluent_kafka.libversion()[0] == \"2.12.1\""'
          docker run --rm --platform "linux/$PLATFORM" --entrypoint sh flight-data-pipeline-consumer:ci-$PLATFORM -c 'test ! -d /app/tests && ! command -v gcc && python -c "import confluent_kafka; assert confluent_kafka.version() == \"2.12.1\"; assert confluent_kafka.libversion()[0] == \"2.12.1\""'
          docker run --rm --platform "linux/$PLATFORM" --entrypoint sh flight-data-pipeline-backend:ci-$PLATFORM -c 'test ! -d /app/tests && ! command -v gcc && python -c "import confluent_kafka; assert confluent_kafka.version() == \"2.12.1\"; assert confluent_kafka.libversion()[0] == \"2.12.1\""'
      - name: Backend image zafiyet taraması
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.platform }}
        with:
          image-ref: flight-data-pipeline-backend:ci-${{ matrix.platform }}
          version: v0.72.0
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Producer image zafiyet taraması
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.platform }}
        with:
          image-ref: flight-data-pipeline-producer:ci-${{ matrix.platform }}
          version: v0.72.0
          skip-setup-trivy: true
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Consumer image zafiyet taraması
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.platform }}
        with:
          image-ref: flight-data-pipeline-consumer:ci-${{ matrix.platform }}
          version: v0.72.0
          skip-setup-trivy: true
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Frontend image zafiyet taraması
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.platform }}
        with:
          image-ref: flight-data-pipeline-frontend:ci-${{ matrix.platform }}
          version: v0.72.0
          skip-setup-trivy: true
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  official-images:
    if: ${{ inputs.release_gate == true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - name: Kafka image zafiyet taraması
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.platform }}
        with:
          image-ref: apache/kafka-native:4.3.1@sha256:2885898ba17065023f1bd605f3a81efcfa986014f062b73b91ef5462485f9060
          version: v0.72.0
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: MongoDB image zafiyet taraması
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.platform }}
        with:
          image-ref: mongodb/mongodb-community-server:8.0.28-ubi9-slim@sha256:905f93fe770819a134dd8f74e14caf319735d068da86ff9c2e7c80dec140f191
          version: v0.72.0
          skip-setup-trivy: true
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İzole Kafka/MongoDB akışı
        run: tests/integration/run.sh
