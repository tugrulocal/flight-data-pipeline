name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Yayını tamamlanacak mevcut v* etiketi"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/flight-data-pipeline
  RELEASE_VERSION: ${{ inputs.release_ref || github.ref_name }}
  RELEASE_REF: ${{ inputs.release_ref || github.ref }}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Sürüm etiketini doğrula
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*) ;;
            *) echo "Geçersiz release etiketi: $VERSION" >&2; exit 1 ;;
          esac
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'

  verify:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      release_gate: true

  publish:
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [producer, consumer, backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - id: source
        name: Kaynak commit'i belirle
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.RELEASE_VERSION }}
            VCS_REF=${{ steps.source.outputs.sha }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: Keyless Cosign imzası
        run: cosign sign --yes "${IMAGE_PREFIX}-${{ matrix.service }}@${{ steps.build.outputs.digest }}"
      - name: Public GHCR erişimini doğrula
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: flight-data-pipeline-${{ matrix.service }}
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          image_tag="${VERSION#v}"
          for attempt in $(seq 1 90); do
            anonymous_token=$(curl -sSL "https://ghcr.io/token?scope=repository:$OWNER/$PACKAGE:pull" | jq -r '.token // empty' || true)
            http_status="token-denied"
            if [ -n "$anonymous_token" ]; then
              http_status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $anonymous_token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json' \
                "https://ghcr.io/v2/$OWNER/$PACKAGE/manifests/$image_tag")
            fi
            if [ "$http_status" = "200" ]; then
              echo "$PACKAGE:$image_tag anonim olarak indirilebilir."
              exit 0
            fi
            echo "Public erişim bekleniyor ($attempt/90, sonuç: $http_status)."
            sleep 10
          done
          echo "$PACKAGE package'ı 15 dakika içinde public erişime açılmadı." >&2
          exit 1

  offline:
    needs: publish
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Platform image'larını indir ve paketle
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/build-offline-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.platform }}
          path: release-out/*

  github-release:
    needs: offline
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-*
          merge-multiple: true
          path: release-out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-rc.') }}
          files: release-out/*
