name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/flight-data-pipeline

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Sürüm etiketini doğrula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*) ;;
            *) echo "Geçersiz release etiketi: $VERSION" >&2; exit 1 ;;
          esac
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'

  verify:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      release_gate: true

  publish:
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [producer, consumer, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: Keyless Cosign imzası
        run: cosign sign --yes "${IMAGE_PREFIX}-${{ matrix.service }}@${{ steps.build.outputs.digest }}"
      - name: GHCR package'ını public yap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: flight-data-pipeline-${{ matrix.service }}
        run: |
          if [ "$OWNER_TYPE" = "Organization" ]; then
            endpoint="/orgs/$OWNER/packages/container/$PACKAGE"
          else
            endpoint="/user/packages/container/$PACKAGE"
          fi
          gh api --method PATCH "$endpoint" -f visibility=public

  offline:
    needs: publish
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Platform image'larını indir ve paketle
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/build-offline-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.platform }}
          path: release-out/*

  github-release:
    needs: offline
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-*
          merge-multiple: true
          path: release-out
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: release-out/*
