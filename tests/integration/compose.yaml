name: flight-data-pipeline-integration

services:
  kafka:
    image: apache/kafka-native:4.3.1@sha256:2885898ba17065023f1bd605f3a81efcfa986014f062b73b91ef5462485f9060
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1000
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 29092"]
      interval: 3s
      timeout: 3s
      retries: 30

  topic-init:
    build:
      context: ../..
      dockerfile: producer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_RETENTION_MS: 60000
      KAFKA_RAW_RETENTION_BYTES: 10485760
      KAFKA_DLQ_RETENTION_MS: 60000
      KAFKA_DLQ_RETENTION_BYTES: 10485760
    entrypoint: ["python", "/app/kafka_admin.py"]

  kafka-tools:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    profiles: ["test-tools"]

  mongodb:
    image: mongodb/mongodb-community-server:8.0.28-ubi9-slim@sha256:905f93fe770819a134dd8f74e14caf319735d068da86ff9c2e7c80dec140f191
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - "0.5"
      - --setParameter
      - ttlMonitorSleepSecs=1
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 3s
      retries: 30

  consumer:
    build:
      context: ../..
      dockerfile: consumer/Dockerfile
    depends_on:
      topic-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGODB_URI: mongodb://mongodb:27017
      CONSUMER_RETRY_BACKOFF_SECONDS: 1
    restart: on-failure

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    depends_on:
      topic-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGODB_URI: mongodb://mongodb:27017
      APP_VERSION: integration
      LIVE_POSITION_WINDOW_MINUTES: 10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:15173:80"
