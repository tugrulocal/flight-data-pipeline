apiVersion: v1
kind: ConfigMap
metadata:
  name: producer-config
data:
  # Producer dışarı doğru konuşur: OpenSky'dan veri alır, Kafka'ya yazar.
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC: aircraft.positions.raw.v1
  POLL_INTERVAL_SECONDS: "120"
  MAX_POLLS: "0"
  OPENSKY_AREA_MODE: global
  # Credential boş bırakılınca producer anonim modda çalışır.
  OPENSKY_CLIENT_ID: ""
  OPENSKY_CLIENT_SECRET: ""
