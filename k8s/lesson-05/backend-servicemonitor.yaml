apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    # kube-prometheus-stack varsayılan olarak yalnız kendi release etiketiyle
    # işaretlenmiş ServiceMonitor kaynaklarını seçer.
    release: monitoring
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
