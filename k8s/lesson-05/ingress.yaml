apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flight-data-pipeline
spec:
  ingressClassName: nginx
  rules:
    - host: flight-data-pipeline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
