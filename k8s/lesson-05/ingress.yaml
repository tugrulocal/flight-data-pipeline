apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flight-data-pipeline
spec:
  ingressClassName: nginx
  rules:
    # Bu host, local ortamda /etc/hosts ile 127.0.0.1'e yönlendirilir.
    # Production'da aynı kural gerçek domainimizle değiştirilecek.
    - host: app.flight.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
