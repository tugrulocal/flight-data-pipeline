apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      # Consumer başlangıçta MongoDB indexlerini oluşturur ve Kafka'ya bağlanır.
      # İki bağımlılık hazır olmadan ana süreci başlatmıyoruz.
      initContainers:
        - name: wait-for-kafka-and-mongodb
          image: apache/kafka-native:4.3.1@sha256:2885898ba17065023f1bd605f3a81efcfa986014f062b73b91ef5462485f9060
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z -w 2 kafka 29092 && nc -z -w 2 mongodb 27017; do
                echo 'Kafka ve MongoDB bekleniyor...'
                sleep 2
              done
      containers:
        - name: consumer
          image: ghcr.io/tugrulocal/flight-data-pipeline-consumer@sha256:c1c9ff73f4112cc9aa588aaea635469af68ebbdc3168e41624de452360cb1514
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: consumer-config
