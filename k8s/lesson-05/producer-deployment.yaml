apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      # İlk OpenSky cevabını broker hazır olmadan almamak için Kafka portunu
      # bekliyoruz; böylece ilk turdaki teslim hatası ve gereksiz kota kullanımı önlenir.
      initContainers:
        - name: wait-for-kafka
          image: apache/kafka-native:4.3.1@sha256:2885898ba17065023f1bd605f3a81efcfa986014f062b73b91ef5462485f9060
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z -w 2 kafka 29092; do
                echo 'Kafka bekleniyor...'
                sleep 2
              done
      containers:
        - name: producer
          image: ghcr.io/tugrulocal/flight-data-pipeline-producer@sha256:5fa81b27495a8dc812b3c04c09de89acb276c38c4bfc4fb8c09a8526a2fc0e19
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: producer-config
            # OAuth bilgileri Git'te değil, cluster içindeki Secret'ta tutulur.
            - secretRef:
                name: opensky-credentials
