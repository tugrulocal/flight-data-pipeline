apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Nginx upstream adını açılışta çözer. Backend Service DNS'i henüz
      # oluşmadıysa Nginx başlamadan çıkar; bu init container o yarışı önler.
      initContainers:
        - name: wait-for-backend
          image: apache/kafka-native:4.3.1@sha256:2885898ba17065023f1bd605f3a81efcfa986014f062b73b91ef5462485f9060
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z -w 2 backend 8000; do
                echo 'Backend bekleniyor...'
                sleep 2
              done
      containers:
        - name: frontend
          image: ghcr.io/tugrulocal/flight-data-pipeline-frontend@sha256:8d60e5f11ebb50bdc979a3e32006f695b1f24d0eaeed8d36a460261bc8116cd8
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
