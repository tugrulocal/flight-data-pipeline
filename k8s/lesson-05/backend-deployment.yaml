apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    # Reloader yalnız bu ConfigMap değiştiğinde backend'i rolling restart eder.
    # Diğer ConfigMap veya Secret değişimleri bu deployment'ı etkilemez.
    configmap.reloader.stakater.com/reload: backend-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Kubernetes aynı anda başlattığı için MongoDB Service'i bu poddan önce
      # DNS'te/portta hazır olmayabilir. Uygulamanın ilk ping ile çıkmasını
      # önlemek için ana container'dan önce burada bekliyoruz.
      initContainers:
        - name: wait-for-mongodb
          image: apache/kafka-native:4.3.1@sha256:2885898ba17065023f1bd605f3a81efcfa986014f062b73b91ef5462485f9060
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z -w 2 mongodb 27017; do
                echo 'MongoDB bekleniyor...'
                sleep 2
              done
      containers:
        - name: backend
          image: ghcr.io/tugrulocal/flight-data-pipeline-backend@sha256:5d5319bd514e3bf3fffff64050c4ff11e998980f812bb403b8b066f34ed190c4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
