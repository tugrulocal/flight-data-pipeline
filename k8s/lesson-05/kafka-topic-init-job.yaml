apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        # Tamamlanmış Job pod şablonu immutable'dır; image release digest'iyle
        # birlikte güncellenir.
        app.kubernetes.io/version: v1.0.0-rc.5
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: ghcr.io/tugrulocal/flight-data-pipeline-producer@sha256:5fa81b27495a8dc812b3c04c09de89acb276c38c4bfc4fb8c09a8526a2fc0e19
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/kafka_admin.py
            - init
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
            - name: KAFKA_TOPIC
              value: aircraft.positions.raw.v1
            - name: KAFKA_DLQ_TOPIC
              value: aircraft.positions.dlq.v1
            - name: KAFKA_RAW_RETENTION_MS
              value: "172800000"
            - name: KAFKA_RAW_RETENTION_BYTES
              value: "10737418240"
            - name: KAFKA_DLQ_RETENTION_MS
              value: "2592000000"
            - name: KAFKA_DLQ_RETENTION_BYTES
              value: "1073741824"
