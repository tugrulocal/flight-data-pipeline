apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flight-data-pipeline

resources:
  - namespace.yaml
  - mongodb-headless-service.yaml
  - mongodb-service.yaml
  - mongodb-statefulset.yaml
  - kafka-headless-service.yaml
  - kafka-service.yaml
  - kafka-statefulset.yaml
  - kafka-topic-init-job.yaml
  - producer-configmap.yaml
  - producer-deployment.yaml
  - consumer-configmap.yaml
  - consumer-deployment.yaml
  - backend-configmap.yaml
  - backend-service.yaml
  - backend-servicemonitor.yaml
  - backend-deployment.yaml
  - frontend-nginx-configmap.yaml
  - frontend-service.yaml
  - frontend-deployment.yaml
  - ingress.yaml

# Grafana sidecar, bu ConfigMap'i grafana_dashboard=1 etiketiyle keşfeder.
# Hash'i kapatmak dashboard adını sabit tutar; Argo güncelleme yapabilir.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: flight-pipeline-overview-dashboard
    files:
      - flight-pipeline-overview.json=dashboards/flight-pipeline-overview.json

labels:
  - pairs:
      app.kubernetes.io/part-of: flight-data-pipeline
    includeSelectors: false
    includeTemplates: true
  # Sürüm her release'te değişir. StatefulSet PVC ve tamamlanmış Job
  # şablonları immutable olduğundan bu etiketi iç şablonlara yaymıyoruz.
  - pairs:
      app.kubernetes.io/version: v1.0.0-rc.4
    includeSelectors: false
    includeTemplates: false
