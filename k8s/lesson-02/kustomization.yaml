apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flight-data-pipeline

resources:
  - namespace.yaml
  - kafka-headless-service.yaml
  - kafka-service.yaml
  - kafka-statefulset.yaml
  - kafka-topic-init-job.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: flight-data-pipeline
      app.kubernetes.io/version: v1.0.0-rc.3
    includeSelectors: false
    includeTemplates: true
