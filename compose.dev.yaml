services:
  kafka:
    ports:
      - "127.0.0.1:9092:9092"

  mongodb:
    ports:
      - "127.0.0.1:27017:27017"

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
